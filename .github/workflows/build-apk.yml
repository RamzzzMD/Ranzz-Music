name: Build Ranzz Music APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Ranzz Music APK (Optimized Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain and Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Ranzz Native Core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o app/src/main/jniLibs build --release --manifest-path ranzz-core/Cargo.toml

      - name: Generate Ranzz Keystore
        run: |
          rm -f app/ranzz.keystore
          keytool -genkey -v -keystore app/ranzz.keystore -alias ranzz -keyalg RSA -keysize 2048 -validity 10000 -storepass ranzzandroidapp -keypass ranzzandroidapp -dname "CN=RanzzMusic, OU=Ranzz, O=Ranzz, L=Jakarta, C=ID"

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK (Optimized R8)
        uses: actions/upload-artifact@v4
        with:
          name: Ranzz-Music-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ranzz-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare Release APKs
        id: prep_release
        run: |
          mkdir -p release-apks
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          TAG_NAME="v${VERSION_NAME:-3.8.4}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/release/*.apk release-apks/Ranzz-Music-${TAG_NAME}-release.apk
          cp app/build/outputs/apk/release/*.apk release-apks/Ranzz-Music-${TAG_NAME}.apk
          cp app/build/outputs/apk/release/*.apk release-apks/Ranzz-Music-Release.apk
          cp app/build/outputs/apk/debug/*.apk release-apks/Ranzz-Music-${TAG_NAME}-debug.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          name: Ranzz Music ${{ steps.prep_release.outputs.tag_name }}
          files: release-apks/*.apk
          generate_release_notes: true
          body: |
            ## 🚀 Ranzz Music ${{ steps.prep_release.outputs.tag_name }} — Pembaruan Besar (Major Update)

            Pembaruan **${{ steps.prep_release.outputs.tag_name }}** menghadirkan mesin native **Rust (`ranzz-core`)**, sistem lirik multi-sumber **LiriQo**, **Widget Beranda Android**, **Dynamic Album Palette**, serta berbagai fitur pemutar baru dengan tetap mempertahankan desain monokrom OLED yang ringan dan bebas iklan.

            ---

            ### ✨ Apa yang Baru di ${{ steps.prep_release.outputs.tag_name }}?

            #### 🦀 1. Ranzz Native Core (Rust JNI Engine)
            - **Mesin Native Rust (`ranzz-core`)**: Pemrosesan jaringan, ekstraksi lirik, sanitasi metadata, dan sistem rekomendasi kini dijalankan secara native di Rust untuk performa instan dan penggunaan RAM super rendah.
            - **InnerTube Native Client**: Klien YouTube Music InnerTube (`WEB_REMIX`) langsung di tingkat native untuk pencarian lagu, rekomendasi beranda, radio automix, dan sinkronisasi *Liked Songs*.
            - **Smart Metadata Sanitizer**: Pembersih judul lagu dan nama artis otomatis dari tag berlebih seperti `(Official Music Video)`, `[Lyrics]`, `VEVO`, `HD`, dll.

            #### 🎤 2. LiriQo Multi-Source Lyrics & Full-Screen Karaoke
            - **4 Sumber Lirik Paralel (LiriQo Engine)**: Mencari lirik tersinkronisasi secara paralel dari **LRCLIB**, **NetEase Cloud Music**, **Musixmatch**, dan **KuGou** dengan algoritma pencocokan durasi & judul presisi.
            - **Word-by-Word / Syllable Karaoke Sync**: Dukungan lirik karaoke per suku kata (*enhanced LRC & KuGou KRC*) dengan animasi sorotan progresif yang halus.
            - **Full-Screen Lyrics View**: Mode lirik layar penuh imersif dengan latar belakang gradasi warna sampul album (*Dynamic Palette*) dan **Instrumental Break Indicator (`•••`)** saat jeda instrumen.
            - **Terjemahan Lirik Dwibahasa Cepat**: Penerjemah baris lirik paralel langsung dari mesin native Rust.

            #### 📱 3. Android Homescreen Widgets
            - **Ranzz Compact Widget (4×1)**: Widget bar horizontal minimalis di layar utama HP dengan sampul album, judul lagu, artis, dan tombol Play/Pause & Next.
            - **Ranzz Square Widget (2×2)**: Widget persegi estetik dengan sampul album resolusi tinggi dan kontrol Previous, Play/Pause, serta Next yang tersinkronisasi secara *real-time*.

            #### 🎛️ 4. Peningkatan Pemutar Musik & Manajemen Antrean
            - **Dynamic Cover Palette**: Ekstraksi warna dominan dari sampul album secara otomatis menggunakan AndroidX Palette untuk latar belakang pemutar penuh & lirik.
            - **Interactive Queue Sheet (Drag & Drop)**: Atur ulang urutan antrean lagu dengan *drag-and-drop*, lompat ke lagu mana saja, atau bersihkan antrean dengan satu ketukan.
            - **Track Options Bottom Sheet**: Menu aksi cepat untuk *Play Next*, *Add to Queue*, *Add to Playlist*, dan *Share Track*.
            - **Sleep Timer & Playback Speed**: Pengatur waktu tidur otomatis (`15m`, `30m`, `45m`, `60m`) dan pengaturan kecepatan putar (`0.5x` – `2.0x`).
            - **Repeat Mode Lengkap & Swipe Artwork**: Dukungan *Repeat Off*, *Repeat All*, *Repeat One*, serta gestur *swipe* kiri/kanan pada sampul album untuk mengganti lagu.

            #### 🔄 5. In-App Auto Updater & Dukungan Dwibahasa (ID / EN)
            - **Pembaruan Langsung di Aplikasi (`UpdateManager`)**: Deteksi otomatis rilis terbaru dari GitHub Releases lengkap dengan dialog *What's New* dan pengunduh/pemasang APK terintegrasi.
            - **Bilingual UI (Bahasa Indonesia & English)**: Pilihan bahasa antarmuka (*Sistem*, *Bahasa Indonesia*, *English*) langsung dari menu Pengaturan, disertai pembaruan profil kustom (*Edit Profile*) dan ikonografi baru.

            ---

            ### 📦 Berkas Unduhan (Assets)
            | Berkas | Ukuran | Keterangan |
            | :--- | :---: | :--- |
            | **`Ranzz-Music-${{ steps.prep_release.outputs.tag_name }}-release.apk`** / **`Ranzz-Music-${{ steps.prep_release.outputs.tag_name }}.apk`** | **12.6 MB** | **Direkomendasikan.** APK rilis resmi (R8 FullMode + Native Rust `arm64-v8a`, `armeabi-v7a`, `x86_64`). |
            | **`Ranzz-Music-${{ steps.prep_release.outputs.tag_name }}-debug.apk`** | **31.02 MB** | APK versi debug untuk pengujian & pengembangan. |
