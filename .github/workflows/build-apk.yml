name: Build Ranzz Music APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Ranzz Music APK (Optimized Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain and Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Ranzz Native Core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release --manifest-path ranzz-core/Cargo.toml

      - name: Prepare Ranzz Keystore
        run: |
          if [ ! -f app/ranzz.keystore ]; then
            keytool -genkey -v -keystore app/ranzz.keystore -alias ranzz -keyalg RSA -keysize 2048 -validity 10000 -storepass ranzzandroidapp -keypass ranzzandroidapp -dname "CN=RanzzMusic, OU=Ranzz, O=Ranzz, L=Jakarta, C=ID"
          fi

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Release APKs
        id: prep_release
        run: |
          mkdir -p release-apks
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          TAG_NAME="v${VERSION_NAME}"
          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"

          if [ -f "${RELEASE_DIR}/app-universal-release.apk" ]; then
            cp "${RELEASE_DIR}/app-universal-release.apk" "release-apks/Ranzz-Music-${TAG_NAME}-release.apk"
          else
            cp "${RELEASE_DIR}/app-release.apk" "release-apks/Ranzz-Music-${TAG_NAME}-release.apk"
          fi
          cp "release-apks/Ranzz-Music-${TAG_NAME}-release.apk" "release-apks/Ranzz-Music-Release.apk"

          if [ -f "${RELEASE_DIR}/app-arm64-v8a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-arm64-v8a-release.apk" "release-apks/Ranzz-Music-${TAG_NAME}-arm64-v8a.apk"
          fi
          if [ -f "${RELEASE_DIR}/app-armeabi-v7a-release.apk" ]; then
            cp "${RELEASE_DIR}/app-armeabi-v7a-release.apk" "release-apks/Ranzz-Music-${TAG_NAME}-armeabi-v7a.apk"
          fi

          if [ -f "${DEBUG_DIR}/app-universal-debug.apk" ]; then
            cp "${DEBUG_DIR}/app-universal-debug.apk" "release-apks/Ranzz-Music-${TAG_NAME}-debug.apk"
          elif [ -f "${DEBUG_DIR}/app-debug.apk" ]; then
            cp "${DEBUG_DIR}/app-debug.apk" "release-apks/Ranzz-Music-${TAG_NAME}-debug.apk"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Ranzz Music APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ranzz-Music-${{ steps.prep_release.outputs.tag_name }}-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          name: Ranzz Music ${{ steps.prep_release.outputs.tag_name }}
          files: release-apks/*.apk
          generate_release_notes: true
          body: |
            ## 🚀 Ranzz Music ${{ steps.prep_release.outputs.tag_name }} — Offline Playback, Vibe Discovery, Comments & Performance

            ### ✨ Apa yang Baru di ${{ steps.prep_release.outputs.tag_name }}?

            - **📥 Offline Audio & Thumbnails (`OfflineMusicManager`)**:
              - ExoPlayer cache data source kini dibungkus dengan `DefaultDataSource.Factory` sehingga file audio lokal (`file://` dan `content://`) dapat diputar tanpa internet dengan stabil.
              - Thumbnail album offline turut diunduh dan disimpan secara lokal serta mempertahankan MIME type & sesi pemutaran offline.
            - **✨ Tab Vibe, Playlist Detail & Komentar Lagu**:
              - Tab **Vibe** baru untuk eksplorasi musik berdasarkan suasana hati & genre.
              - **Playlist Detail Sheet** & **Comments Bottom Sheet** untuk melihat dan menulis komentar YouTube langsung dari pemutar.
              - Dukungan **12 Bahasa** (EN, ID, JA, KO, ZH, ES, FR, DE, PT, RU, AR) serta cache UI & riwayat (`UiStateCache`, `HistoryStore`).
            - **🦀 Peningkatan Mesin Native Rust (`ranzz-core`) & LiriQo**:
              - Penanganan JNI exception yang lebih aman, deserialisasi LiriQo lebih fleksibel, peringkat penyedia lirik & parsing LRC multi-timestamp/offset lebih akurat.
            - **⚡ Optimasi Performa & Perbaikan Kritis**:
              - Penyatuan seluruh OkHttp client ke satu `ConnectionPool` dan `Dispatcher` bersama melalui `HttpClientProvider.baseClient`.
              - Polling pemutaran adaptif (100ms saat layar penuh / 500ms saat mini), pemindahan startup disk I/O dari main thread, dan split APK per-ABI (`arm64-v8a`, `armeabi-v7a`, & Universal).
              - Perbaikan *Add to Playlist*, tombol Share, auto-scroll lirik layar penuh, swipe antrean, serta aturan ProGuard/R8 & `MediaSessionService` Android 13–14.
