name: Build Ranzz Music APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Ranzz Music APK (Optimized Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Ranzz Keystore
        run: |
          rm -f app/ranzz.keystore
          keytool -genkey -v -keystore app/ranzz.keystore -alias ranzz -keyalg RSA -keysize 2048 -validity 10000 -storepass ranzzandroidapp -keypass ranzzandroidapp -dname "CN=RanzzMusic, OU=Ranzz, O=Ranzz, L=Jakarta, C=ID"

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK (Optimized R8)
        uses: actions/upload-artifact@v4
        with:
          name: Ranzz-Music-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ranzz-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apks
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v3.4.1"
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/Ranzz-Music-${TAG_NAME}.apk
          cp app/build/outputs/apk/release/*.apk release-apks/Ranzz-Music-Release.apk
          cp app/build/outputs/apk/debug/*.apk release-apks/Ranzz-Music-${TAG_NAME}-debug.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
