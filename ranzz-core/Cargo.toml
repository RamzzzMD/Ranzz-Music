[package]
name = "ranzz-core"
version = "0.1.0"
edition = "2021"
authors = ["RamzzzMD"]
description = "High-performance native core engine for Ranzz Music Player"

[lib]
name = "ranzz_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"

